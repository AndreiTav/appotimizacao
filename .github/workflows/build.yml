name: Compilar e validar
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore tests/NexusOptimizer.Tests --locked-mode
      - run: dotnet test tests/NexusOptimizer.Tests -c Release --no-restore --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-core
          path: artifacts/test-results
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compilar, testar e publicar portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          try {
            & ./scripts/build.ps1 *>&1 | Tee-Object -FilePath artifacts/windows-build.log
            if ($LASTEXITCODE -ne 0) { throw "Build retornou código $LASTEXITCODE" }
            "## Verificação Windows`n`nBuild, testes nativos e smoke test concluídos." | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content artifacts/test-results/windows-ui-smoke.json | Add-Content $env:GITHUB_STEP_SUMMARY
          } catch {
            $_.ToString() | Add-Content artifacts/windows-build.log
            '## Falha da verificação Windows' | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content artifacts/windows-build.log -Tail 70 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            $excerpt = (Get-Content artifacts/windows-build.log -Tail 40) -join "`n"
            $annotation = $excerpt.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$annotation"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/test-results
            artifacts/windows-build.log
