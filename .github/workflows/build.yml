name: Compilar e validar
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore tests/NexusOptimizer.Tests --locked-mode
      - run: dotnet test tests/NexusOptimizer.Tests -c Release --no-restore --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testes-core
          path: artifacts/test-results
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compilar, testar e publicar portátil
        shell: pwsh
        run: ./scripts/build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/test-results
